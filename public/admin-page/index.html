<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Edit the site</title>
    <style>
      :root {
        --ink: #1b1d22;
        --muted: #6b7280;
        --surface: #fff;
        --line: #e4e6ea;
        --brand: #2b4c9b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eceef2;
          --muted: #a2a8b4;
          --surface: #1b1d22;
          --line: #353a44;
          --brand: #8fa9e8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--surface);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .gate {
        width: 100%;
        max-width: 25rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
      }
      h1 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 600; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.875rem; }
      label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 0.875rem; font-weight: 500; }
      input {
        font: inherit;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink);
      }
      button {
        font: inherit;
        font-weight: 500;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 7px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .error { margin: 14px 0 0; color: #c0342b; font-size: 0.875rem; min-height: 1.4em; }
      @media (prefers-color-scheme: dark) { .error { color: #f28b82; } }
      .note { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.75rem; }
      a { color: var(--brand); }
    </style>
  </head>
  <body>
    <!--
      This passphrase check keeps the page out of casual reach. It is NOT
      security: the hash below ships in a public repository, so treat it as a
      doormat rather than a lock.

      The real boundary is GitHub itself. Nothing on this page can read or write
      anything until you sign in with a GitHub account that has write access to
      the repository, and that happens on the next screen.

      To change the passphrase, run:
        node -e "console.log(require('node:crypto').createHash('sha256').update('USER:PASS').digest('hex'))"
      and paste the result into GATE_HASH below.
    -->
    <form class="gate" id="gate">
      <h1>Edit the site</h1>
      <p class="sub">Enter the shared passphrase, then sign in with GitHub.</p>

      <label>
        Username
        <input id="user" name="username" autocomplete="username" autofocus required />
      </label>

      <label>
        Passphrase
        <input id="pass" name="password" type="password" autocomplete="current-password" required />
      </label>

      <button type="submit">Continue</button>
      <p class="error" id="error" role="alert"></p>

      <p class="note">
        Lost the passphrase, or seeing this by accident? You can always edit the
        files directly on GitHub instead. See <code>CONTENT.md</code> in the
        repository.
      </p>
    </form>

    <script>
      // sha256('username:passphrase'). See the comment above to change it.
      const GATE_HASH =
        '7edb9e78935ace77c356e45624e058b1ffb0c2e3ed7b445754b1c3806be38efb';

      const CMS_SCRIPT = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';

      async function sha256(text) {
        const bytes = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return [...new Uint8Array(digest)]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function loadCms() {
        document.getElementById('gate')?.remove();
        document.body.style.display = 'block';
        document.body.style.padding = '0';
        const script = document.createElement('script');
        script.src = CMS_SCRIPT;
        document.body.appendChild(script);
      }

      // Stay unlocked for the rest of the browser session only.
      if (sessionStorage.getItem('cms-unlocked') === '1') {
        loadCms();
      }

      document.getElementById('gate')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const user = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value;
        const error = document.getElementById('error');

        if ((await sha256(`${user}:${pass}`)) === GATE_HASH) {
          try {
            sessionStorage.setItem('cms-unlocked', '1');
          } catch {
            // Private browsing can refuse storage; carrying on is fine.
          }
          loadCms();
        } else {
          error.textContent = 'That username or passphrase is not right.';
          document.getElementById('pass').value = '';
        }
      });
    </script>
  </body>
</html>
