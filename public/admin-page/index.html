<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keeps the page out of search results. robots.txt is only read at a domain root. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Edit the site</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      The password is checked by the Worker, not here, and the credential that can
      write to the repository never reaches this page. Signing in returns a signed
      session token that expires after eight hours.
    -->
    <section id="login">
      <form id="login-form">
        <h1>Edit the site</h1>
        <p class="sub">Sign in to add and edit content.</p>

        <div class="field">
          <label for="login-user">Username</label>
          <input id="login-user" type="text" autocomplete="username" value="root" autofocus required />
        </div>

        <div class="field">
          <label for="login-pass">Password</label>
          <input id="login-pass" type="password" autocomplete="current-password" required />
        </div>

        <button id="login-button" class="primary" type="submit">Sign in</button>
        <p id="login-error" role="alert"></p>

        <p class="note">
          Saving writes directly to the site. Changes appear within about a minute.
          A mistake cannot break the live site: if the content will not build, the
          previous version stays up and you get an email.
        </p>
      </form>
    </section>

    <section id="app" hidden>
      <header class="bar">
        <h1>Edit the site</h1>
        <div>
          <a class="ghost" href="../" style="text-decoration: none; padding: 7px 12px">View site</a>
          <button id="sign-out" class="ghost" type="button">Sign out</button>
        </div>
      </header>

      <nav id="nav" aria-label="Content sections"></nav>

      <div>
        <div style="padding: 10px 16px 0; max-width: 46rem">
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
        <div id="main"></div>
      </div>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
