# Sveltia CMS configuration.
#
# This drives the forms at /admin-page. Every field here mirrors a field in
# src/content.config.ts, which is the real schema: if the two drift apart, the
# CMS will happily write content that fails the build. The test in
# tests/admin-config.test.ts exists to catch that.

backend:
  name: github
  repo: saptadeb/lab-website
  branch: main
  # Uncomment once a Cloudflare Worker authenticator is deployed, so editors can
  # sign in with a normal GitHub login instead of pasting a token.
  # See docs/editing-the-site.md.
  # base_url: https://your-worker.workers.dev

# Update both when the custom domain goes live. They only drive the CMS's own
# "view site" links, so a stale value is cosmetic rather than breaking.
site_url: https://saptadeb.github.io/lab-website
display_url: https://saptadeb.github.io/lab-website

# Filenames become page addresses, so keep them boring and url-safe.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Fallback for anything without a collection-level override.
# Base-less on purpose. The base path is env-driven (see astro.config.mjs), so a
# prefix baked into committed content would 404 the day a custom domain lands.
# Templates prefix these at render time with url() from src/lib/url.ts.
media_folder: public/uploads
public_folder: /uploads

editor:
  preview: false

collections:
  # ---------------------------------------------------------------- news
  - name: news
    label: News
    label_singular: News post
    description: Announcements, papers, talks, and awards.
    folder: src/content/news
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.date | date('yyyy-MM')}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{fields.date | date('yyyy-MM-dd')}} · {{title}}"
    # Images live beside the posts, which is what the schema expects.
    media_folder: images
    public_folder: './images'
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Date,
          name: date,
          widget: datetime,
          date_format: 'yyyy-MM-dd',
          time_format: false,
          picker_utc: true,
        }
      - {
          label: Summary,
          name: summary,
          widget: text,
          required: false,
          hint: One sentence. Shows on the news list and in the RSS feed.
        }
      - { label: Image, name: image, widget: image, required: false }
      - {
          label: Image description,
          name: imageAlt,
          widget: string,
          required: false,
          hint: Describe the image for people using a screen reader.
        }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - {
          label: Hide from the site,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
          hint: Keeps the post in the repository but off the live site.
        }
      - { label: Post, name: body, widget: markdown }

  # -------------------------------------------------------------- people
  - name: people
    label: People
    label_singular: Person
    description: Everyone in the lab, past and present.
    folder: src/content/people
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{name}}'
    identifier_field: name
    sortable_fields: [order, name, role]
    summary: '{{name}} · {{role}}'
    media_folder: photos
    public_folder: './photos'
    fields:
      - { label: Name, name: name, widget: string }
      - label: Role
        name: role
        widget: select
        options:
          - { label: Principal Investigator, value: pi }
          - { label: Postdoctoral Researcher, value: postdoc }
          - { label: Graduate Student, value: grad }
          - { label: Undergraduate Researcher, value: undergrad }
          - { label: Staff, value: staff }
          - { label: Alum, value: alum }
          - { label: Collaborator, value: collaborator }
      - {
          label: Job title,
          name: title,
          widget: string,
          required: false,
          hint: Shown under the name, e.g. "PhD Student".
        }
      - { label: Photo, name: photo, widget: image, required: false }
      - {
          label: Email,
          name: email,
          widget: string,
          required: false,
          pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address'],
        }
      - {
          label: One-line blurb,
          name: blurb,
          widget: text,
          required: false,
          hint: Appears on the people grid card.
        }
      - label: Links
        name: links
        widget: object
        required: false
        collapsed: true
        fields:
          - {
              label: Website,
              name: website,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
          - {
              label: Google Scholar,
              name: scholar,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
          - {
              label: GitHub,
              name: github,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
          - {
              label: LinkedIn,
              name: linkedin,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
          - {
              label: X,
              name: x,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
          - {
              label: ORCID,
              name: orcid,
              widget: string,
              required: false,
              pattern: ['^https?://', 'Must start with https://'],
            }
      - { label: Research interests, name: interests, widget: list, required: false, default: [] }
      - {
          label: Years in the lab,
          name: yearsInLab,
          widget: string,
          required: false,
          hint: Alumni only, e.g. 2021-2026.
        }
      - {
          label: Current affiliation,
          name: currentAffiliation,
          widget: string,
          required: false,
          hint: Alumni only.
        }
      - {
          label: Sort order,
          name: order,
          widget: number,
          required: false,
          default: 99,
          value_type: int,
          hint: Lower numbers appear first within a group.
        }
      - { label: Hide from the site, name: draft, widget: boolean, default: false, required: false }
      - { label: Bio, name: body, widget: markdown }

  # ----------------------------------------------------- research areas
  - name: projects
    label: Research areas
    label_singular: Research area
    description: The focus topics listed on the Research page.
    folder: src/content/projects
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{title}}'
    sortable_fields: [order, title]
    summary: '{{title}}'
    media_folder: images
    public_folder: './images'
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Summary,
          name: summary,
          widget: text,
          hint: One sentence for the card on the Research page.
        }
      - { label: Thumbnail, name: thumbnail, widget: image, required: false }
      - {
          label: Sort order,
          name: order,
          widget: number,
          required: false,
          default: 99,
          value_type: int,
        }
      - label: Status
        name: status
        widget: select
        default: active
        options:
          - { label: Active, value: active }
          - { label: Completed, value: completed }
      - {
          label: Topics,
          name: topics,
          widget: list,
          required: false,
          default: [],
          hint: Publications sharing a topic appear on this page automatically.
        }
      - {
          label: Show on the home page,
          name: featured,
          widget: boolean,
          default: false,
          required: false,
        }
      - { label: Hide from the site, name: draft, widget: boolean, default: false, required: false }
      - { label: Description, name: body, widget: markdown }

  # ------------------------------------------------------- publications
  - name: publications
    label: Publications
    label_singular: Publication
    description: Papers, preprints, patents, and theses.
    folder: src/content/publications
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{fields.year}}-{{title}}'
    sortable_fields: [year, title]
    summary: '{{fields.year}} · {{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Authors
        name: authors
        widget: list
        hint: In order. Wrap lab members in double asterisks, e.g. **Jane Doe**.
        field: { label: Author, name: author, widget: string }
      - {
          label: Venue,
          name: venue,
          widget: string,
          hint: Journal or conference, with volume and pages if you have them.
        }
      - { label: Year, name: year, widget: number, value_type: int }
      - label: Type
        name: type
        widget: select
        default: journal
        options:
          - { label: Journal article, value: journal }
          - { label: Conference paper, value: conference }
          - { label: Workshop paper, value: workshop }
          - { label: Preprint, value: preprint }
          - { label: Thesis, value: thesis }
          - { label: Patent, value: patent }
      - {
          label: DOI,
          name: doi,
          widget: string,
          required: false,
          hint: 'Just the identifier, starting with 10. Not the full https://doi.org link.',
        }
      - {
          label: Link,
          name: url,
          widget: string,
          required: false,
          pattern: ['^https?://', 'Must start with https://'],
        }
      - {
          label: PDF,
          name: pdf,
          widget: file,
          required: false,
          media_folder: /public/pdfs,
          public_folder: /pdfs,
        }
      - {
          label: Code repository,
          name: code,
          widget: string,
          required: false,
          pattern: ['^https?://', 'Must start with https://'],
        }
      - { label: Topics, name: topics, widget: list, required: false, default: [] }
      - {
          label: Show on the home page,
          name: featured,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: Related research area
        name: project
        widget: relation
        required: false
        collection: projects
        search_fields: [title]
        display_fields: [title]
        value_field: '{{slug}}'
      - { label: BibTeX, name: bibtex, widget: text, required: false }
      - {
          label: Note,
          name: note,
          widget: string,
          required: false,
          hint: 'Shown after the venue, e.g. "Under review".',
        }
