name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type checking and unit tests gate everything below them.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check templates and content schemas
        run: npm run check

      - name: Unit tests
        run: npm run test

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Once a custom domain is live, set repository variables SITE_URL
      # (e.g. https://arabilab.com) and BASE_PATH (/) and these follow.
      SITE_URL: ${{ vars.SITE_URL || 'https://saptadeb.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/lab-website' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pull requests stop after build; only pushes to main publish.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
