name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type checking and unit tests gate everything below them.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check templates and content schemas
        run: npm run check

      - name: Unit tests
        run: npm run test

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Once a custom domain is live, set repository variables SITE_URL
      # (e.g. https://arabilab.com) and BASE_PATH (/) and these follow.
      SITE_URL: ${{ vars.SITE_URL || 'https://saptadeb.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/lab-website' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pull requests stop after build; only pushes to main publish.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # An edit that fails to build never reaches the live site, which means failure
  # is silent unless someone is told. Whoever saved the change is the least
  # likely to go looking in the Actions tab, so the run reports itself.
  #
  # Two routes, because one of them needs no setup at all:
  #   1. Open or update a GitHub issue. No secrets, works immediately, and
  #      GitHub emails everyone watching the repository.
  #   2. Send mail directly over SMTP, but only once SMTP_PASSWORD exists.
  #      See docs/build-notifications.md.
  notify-failure:
    # deploy is included so a publishing failure reports itself too, not just
    # a failed test or build.
    needs: [verify, build, deploy]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update a build failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const message = (context.payload.head_commit?.message ?? '').split('\n')[0];
            const author = context.payload.head_commit?.author?.name ?? context.actor;

            const body = [
              'The site did not publish, so the previous version is still live.',
              '',
              `**Commit:** \`${sha}\` ${message}`,
              `**Saved by:** ${author}`,
              `**Failed run:** ${run}`,
              '',
              'Open the run above and read the first red step. The usual causes are a',
              'required field left empty, a link that does not start with `https://`,',
              'or an image that did not finish uploading.',
              '',
              'Nothing is broken on the live site. Fix the content and save again, and',
              'this issue closes itself on the next successful build.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure',
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'The site failed to publish',
                labels: ['build-failure'],
                body,
              });
            }

      - name: Send mail
        # The secrets context cannot be read in an `if`, so it is lifted to env
        # first. Without the secret this step is skipped, not failed.
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        if: env.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Lab website <${{ secrets.SMTP_USERNAME }}>
          to: ${{ vars.NOTIFY_EMAIL || 'saptadeep.deb@gmail.com' }}
          subject: 'Lab website did not publish'
          body: |
            The site did not publish, so the previous version is still live.

            Commit: ${{ github.sha }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Open the run and read the first red step. Nothing is broken on the
            live site; fix the content and save again.

  # Close the failure issue once a build succeeds again, so an open issue always
  # means the live site is behind the repository.
  clear-failure:
    needs: deploy
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure',
            });

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The site published successfully, so this is resolved.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
